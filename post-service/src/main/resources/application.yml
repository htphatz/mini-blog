server:
  port: 8083
  servlet:
    context-path: /post

spring:
  application:
    name: post-service
  data:
    mongodb:
      authentication-database: admin
      username: root
      password: root
      database: post-service
      port: 27017
      host: localhost

services:
  profile:
    url: http://localhost:8081/profile

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true