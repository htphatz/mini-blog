server:
  port: 8083
  address: 127.0.0.1 # only the gateway (same host) may reach this service directly
  servlet:
    context-path: /post

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: post-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/mini-blog-realm
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
  data:
    mongodb:
      authentication-database: admin
      username: ${MONGO_ROOT_USERNAME}
      password: ${MONGO_ROOT_PASSWORD}
      database: post-service
      port: 27017
      host: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
        automaticTransitionFromOpenToHalfOpenEnabled: true
    instances:
      profileServiceCB:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 3000ms

services:
  profile:
    url: http://localhost:8081/profile

keycloak:
  client-id: post-service-client # Keycloak client that owns this service's permissions (client roles in resource_access)

grpc:
  client:
    profile-service:
      address: 'discovery:///profile-service'
      negotiationType: plaintext
      enableKeepAlive: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1 # register loopback so the gateway can still reach the loopback-bound service