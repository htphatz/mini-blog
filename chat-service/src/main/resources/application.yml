server:
  port: 8084
  address: 127.0.0.1 # only the gateway (same host) may reach this service directly
  servlet:
    context-path: /chat

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: chat-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/mini-blog-realm
  data:
    mongodb:
      authentication-database: admin
      username: ${MONGO_ROOT_USERNAME}
      password: ${MONGO_ROOT_PASSWORD}
      database: chat-service
      port: 27017
      host: localhost
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1 # register loopback so the gateway can still reach the loopback-bound service
