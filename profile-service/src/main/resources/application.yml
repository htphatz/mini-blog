server:
  port: 8081
  address: 127.0.0.1 # only the gateway (same host) may reach this service directly
  servlet:
    context-path: /profile

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: profile-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/mini-blog-realm
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: profile-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

grpc:
  server:
    port: 9091
    address: 127.0.0.1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1 # register loopback so the gateway can still reach the loopback-bound service
    metadata-map:
      grpc-port: ${grpc.server.port:9091}
      gRPC: ${grpc.server.port:9091}

