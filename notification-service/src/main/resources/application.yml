server:
  port: 8082
  address: 127.0.0.1 # only the gateway (same host) may reach this service directly
  servlet:
    context-path: /notification

spring:
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  application:
    name: notification-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/mini-blog-realm
  data:
    mongodb:
      authentication-database: admin
      username: ${MONGO_ROOT_USERNAME}
      password: ${MONGO_ROOT_PASSWORD}
      database: notification-service
      port: 27017
      host: localhost
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

brevo:
  api-key: ${BREVO_API_KEY}
  template-id: 2

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1 # register loopback so the gateway can still reach the loopback-bound service