server:
  port: 8080
  address: 127.0.0.1 # only the gateway (same host) may reach this service directly
  servlet:
    context-path: /identity

spring:
  application:
    name: identity-service
  datasource:
    url: ${DBMS_CONNECTION:jdbc:mysql://localhost:3306/identity-service}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_ROOT_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  config:
    import:
      - "optional:configserver:http://localhost:8888"
      - "optional:file:./.env[.properties]"
      - "optional:file:../.env[.properties]"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8484/realms/mini-blog-realm

jwt:
  signerKey: 1TjXchw5FloESb63Kc+DFhTARvpWL4jUGCwfGWxuG5SIf/1y/LgJxHnMqaF6A/ij
  duration: 1 #hour

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /api-docs.html

open:
  api:
    title: API Documents
    version: v1.0.0
    description: APIs docs for Green Shop website
    serverUrl: ${API_SERVER_URL:http://localhost:8080}
    serverDescription: local

services:
  profile:
    url: http://localhost:8081/profile

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1 # register loopback so the gateway can still reach the loopback-bound service

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, env

keycloak:
  server-url: http://localhost:8484
  realm: mini-blog-realm
  client-id: identity-service-client
  client-secret: ${KEYCLOAK_CLIENT_SECRET}